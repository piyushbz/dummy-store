<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64" fill="none">
  <!-- Cute Cartoon Mascot (Red Rounded Tile) -->
  <g transform="translate(6, 7)">
    <rect width="50" height="50" rx="13" fill="#E12D2D"/>
    
    <!-- Scaled Mascot Group -->
    <g transform="scale(0.5)">
      <!-- Chubby Living Character Body -->
      <path d="M 50 24 C 32 24, 26 39, 26 58 C 26 73, 33 80, 40 76 C 45 73, 47 76, 50 76 C 53 76, 55 73, 60 76 C 67 80, 74 73, 74 58 C 74 39, 68 24, 50 24 Z" fill="#FFFFFF"/>
      
      <!-- Left arm waving hello -->
      <path d="M 27 52 C 18 47, 16 38, 21 34 C 26 30, 29 42, 28 50 Z" fill="#FFFFFF"/>
      
      <!-- Right arm resting -->
      <ellipse cx="73" cy="54" rx="4.5" ry="4" fill="#FFFFFF"/>

      <!-- Tilted Backwards Street Cap -->
      <path d="M 33 29 C 36 19, 64 19, 67 29 C 61 26, 39 26, 33 29 Z" fill="#1E293B"/>
      <path d="M 61 25 C 71 25, 77 28, 78 31 C 77 33, 69 32, 61 30 Z" fill="#0F172A"/>
      <circle cx="50" cy="20" r="2.5" fill="#E12D2D"/>

      <!-- Big Glossy Living Eye (Left) -->
      <ellipse cx="42" cy="45" rx="4.5" ry="6" fill="#0F172A"/>
      <circle cx="40.5" cy="42.5" r="2" fill="#FFFFFF"/>
      <circle cx="43.5" cy="47" r="0.9" fill="#FFFFFF"/>

      <!-- Big Glossy Living Eye (Right) -->
      <ellipse cx="58" cy="45" rx="4.5" ry="6" fill="#0F172A"/>
      <circle cx="56.5" cy="42.5" r="2" fill="#FFFFFF"/>
      <circle cx="59.5" cy="47" r="0.9" fill="#FFFFFF"/>

      <!-- Soft Pink Rosy Cheeks -->
      <ellipse cx="35" cy="52" rx="4.5" ry="2.2" fill="#FDA4AF"/>
      <ellipse cx="65" cy="52" rx="4.5" ry="2.2" fill="#FDA4AF"/>

      <!-- Cheerful Open Smile with Cute Tongue -->
      <path d="M 45 52 Q 50 60 55 52 Z" fill="#0F172A"/>
      <path d="M 47 55 Q 50 59 53 55 Z" fill="#FB7185"/>
    </g>
  </g>

  <!-- Clean Typography -->
  <text x="68" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" font-size="22" font-weight="900" fill="#111827" letter-spacing="-0.03em">DUMMY</text>
  <text x="164" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" font-size="22" font-weight="900" fill="#E12D2D" letter-spacing="-0.03em">STORE</text>

  <!-- Tagline -->
  <text x="69" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" font-size="8" font-weight="700" fill="#64748B" letter-spacing="0.22em">ORIGINAL MERCH &amp; STREETWEAR</text>
</svg>
